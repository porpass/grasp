name: Feature Request
description: Suggest new functionality or an improvement to GRaSP.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please describe what you'd like and why.

        Before filing, please search existing issues to avoid duplicates. If you find a related one, add a comment there instead.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short description of the request.
      placeholder: e.g. Add support for exporting focused radargrams to SEG-Y
    validations:
      required: true
  - type: dropdown
    id: instrument
    attributes:
      label: Instrument
      description: Which instrument(s) is this relevant to, if any?
      options:
        - Not applicable / all
        - SHARAD
        - MARSIS
        - LRS
        - Multiple
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of GRaSP does this relate to? Choose the closest match, or "Other / not sure".
      options:
        - Data loading / parsing (PDS, input formats)
        - Instrument support (SHARAD / MARSIS / LRS)
        - Range compression / focusing
        - Clutter simulation
        - EMI / interference suppression
        - Geometry / SPICE
        - Geolocation / datuming / DEM
        - Output / file writing
        - Configuration / parameters
        - Installation / packaging / dependencies
        - Documentation
        - Other / not sure
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what makes it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Describe the behavior, and a proposed API or interface if you have one in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you currently use, or other approaches you thought about.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps — references, papers, example datasets, or similar tools.
    validations:
      required: false
