[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp"
version = "0.6.0a1"
description = "Generalized Radar Sounder Processor"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Matthew R. Perry", email = "grasp@psi.edu"}
]
maintainers = [
    { name = "Matthew R. Perry", email = "grasp@psi.edu"}
]
keywords = ["radar", "sounder", "planetary", "sharad", "marsis", "lrs", "geophysics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "matplotlib>=3.10,<4",
    "rasterio>=1.4,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.7,<4",
    "bitstring>=4.3,<5",
    "tqdm>=4.67,<5",
    "pandas>=2.2,<3",
    "spiceypy>=6.0,<7",
    "pvl>=1.3,<2",
    "pds4-tools>=1.4,<2",
    "segyio>=1.9,<2",
    "geopandas>=1.1,<2",
    "antimeridian>=0.4,<0.5",
    "pyogrio>=0.12,<0.13",
    "h5py>=3.16,<4",
]

[project.optional-dependencies]
dev = [
    "ipython>=9.0,<10",
    "jupyterlab>=4.3,<5",
    "notebook>=7.3,<8",
    "pandas-stubs>=2.2,<3",
]

docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocs-material-extensions>=1.3,<2",
    "mkdocstrings>=1.0,<2",
    "mkdocstrings-python>=2.0,<3",
    "mkdocs-autorefs>=1.4,<2",
]

test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/mr-perry/grasp"
Repository = "https://github.com/mr-perry/grasp"
Issues = "https://github.com/mr-perry/grasp/issues"

[project.scripts]
grasp = "grasp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["grasp*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
grasp = ["sharad/calibrated_chirps/*", "defaults/*.toml", "processing_support.toml"]
